site_name: engram
site_description: Memory, retrieval and project continuity for work that spans conversations.
site_url: https://engram-memory.dev
repo_url: https://github.com/raya-ac/engram
repo_name: raya-ac/engram

theme:
  name: material
  custom_dir: docs/overrides
  font: false
  logo: assets/logo.svg
  favicon: assets/favicon.png
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/stylesheets/engram.css
extra_javascript:
  - assets/javascripts/engram.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
