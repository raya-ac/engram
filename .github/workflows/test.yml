name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-bge-small-v1

      - name: Install
        run: pip install -e ".[dev]"

      - name: Download models
        run: |
          python -c "
          from sentence_transformers import SentenceTransformer
          SentenceTransformer('BAAI/bge-small-en-v1.5')
          print('bge-small downloaded')
          "

      - name: Run tests
        run: pytest tests/ -v --tb=short

  package:
    name: package checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install build twine
          python -m build
      - name: Check archive contents and metadata
        run: |
          python scripts/check_distribution.py
          python -m twine check --strict dist/*
      - name: Smoke-test the installed wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/engram-package-smoke"
          "$RUNNER_TEMP/engram-package-smoke/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/engram-package-smoke/bin/python" -m pip install PyYAML
          python scripts/check_distribution.py --smoke-python "$RUNNER_TEMP/engram-package-smoke/bin/python"
      - name: Retain verified distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  postgres-onboarding:
    name: postgres onboarding
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: engram_ci
          POSTGRES_PASSWORD: engram_ci_ephemeral
          POSTGRES_DB: engram_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U engram_ci -d engram_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ENGRAM_TEST_POSTGRES_DSN: postgresql://engram_ci:engram_ci_ephemeral@127.0.0.1:5432/engram_ci
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify isolated PostgreSQL onboarding and diagnostics
        run: python -m pytest tests/test_onboarding_postgres.py tests/test_setup.py tests/test_doctor.py -v --tb=short
