name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: pip install 'mkdocs>=1.6,<2' 'mkdocs-material>=9,<10'

      - name: Deploy
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path("docs/build.json").write_text(json.dumps({"source_revision": os.environ["GITHUB_SHA"], "workflow_run": os.environ["GITHUB_RUN_ID"]}) + "\n")
          PY
          mkdocs gh-deploy --force
