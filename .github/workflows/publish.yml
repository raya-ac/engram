name: publish to PyPI

on:
  release:
    types: [published]

jobs:
  verify:
    name: verify release distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install build twine
          python -m build
      - name: Check release tag, archive contents, and metadata
        run: |
          python scripts/check_distribution.py --expected-tag "$GITHUB_REF_NAME"
          python -m twine check --strict dist/*
      - name: Smoke-test the installed wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/engram-package-smoke"
          "$RUNNER_TEMP/engram-package-smoke/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/engram-package-smoke/bin/python" -m pip install PyYAML
          python scripts/check_distribution.py --expected-tag "$GITHUB_REF_NAME" --smoke-python "$RUNNER_TEMP/engram-package-smoke/bin/python"
      - name: Retain verified distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist
      - name: Publish verified distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
